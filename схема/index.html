<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading AI - Bubble Maps</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Vis.js Library -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header class="glass-panel">
            <h1>Анализ кошельков: <span id="tokenSymbol">Токен</span></h1>
            <p>Карта топ-холдеров и связей (размер зависит от %).</p>
        </header>

        <section class="visualizer glass-panel">
            <div class="controls">
                <button id="resetBtn" class="btn">Восстановить вид</button>
            </div>
            <div id="network"></div>
            
            <!-- Hover Widget -->
            <div id="walletWidget" class="wallet-widget hidden">
                <h3 id="widgetRole" class="widget-role">Holder</h3>
                <p><strong>Адрес:</strong> <span id="widgetAddress">...</span></p>
                <p><strong>Доля:</strong> <span id="widgetPct">0</span>%</p>
                <p><strong>Источник:</strong> <span id="widgetFunding">...</span></p>
            </div>
        </section>
    </main>

    <!-- Initialization -->
    <script src="script.js"></script>
</body>
</html>
