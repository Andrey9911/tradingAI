<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архитектура Trading AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Vis.js Library -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header class="glass-panel">
            <h1>Интерактивная архитектура <span>Trading AI</span></h1>
            <p>Вы можете свободно перемещать блоки (drag&drop) и масштабировать схему для удобного анализа.</p>
        </header>

        <section class="visualizer glass-panel">
            <div class="controls">
                <button id="resetBtn" class="btn">Восстановить вид</button>
            </div>
            <div id="network"></div>
        </section>
        
        <footer class="glass-panel text-center">
            <p>Спроектировано для визуализации логики проекта Trading AI Ecosystem</p>
        </footer>
    </main>

    <!-- Schema Data -->
    <script src="schema.js"></script>
    <!-- Initialization -->
    <script src="script.js"></script>
</body>
</html>
